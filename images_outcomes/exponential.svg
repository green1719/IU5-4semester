<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#ffffff"/>
  <!-- axes -->
  <line x1="80" y1="12" x2="80" y2="190" stroke="#333" stroke-width="1.8"/>
  <line x1="10" y1="150" x2="288" y2="150" stroke="#333" stroke-width="1.8"/>
  <polygon points="80,8 76,18 84,18" fill="#333"/>
  <polygon points="292,150 282,146 282,154" fill="#333"/>
  <text x="86" y="16" font-size="12" fill="#333" font-family="Arial">y</text>
  <text x="283" y="165" font-size="12" fill="#333" font-family="Arial">x</text>
  <!-- y=2^x, origin=(80,150), 1 unit x=40px, 1 unit y=30px, y-up -->
  <!-- x=-2: y=0.25 → svg(0,142.5)  x=-1: y=0.5 → svg(40,135)  x=0: y=1 → svg(80,120)
       x=1: y=2 → svg(120,90)  x=2: y=4 → svg(160,30)  x=2.3: y≈5 → svg(172,0) -->
  <polyline
    fill="none" stroke="#E0632D" stroke-width="2.5" stroke-linejoin="round"
    points="
      0,147.5
      20,143.75
      40,142.5
      60,136.25
      80,120
      120,90
      160,30
      172,0
    "
  />
  <!-- tick labels -->
  <text x="73" y="164" font-size="10" fill="#555" font-family="Arial">0</text>
  <text x="113" y="164" font-size="10" fill="#555" font-family="Arial">1</text>
  <text x="153" y="164" font-size="10" fill="#555" font-family="Arial">2</text>
  <text x="33" y="164" font-size="10" fill="#555" font-family="Arial">-1</text>
  <text x="84" y="121" font-size="10" fill="#555" font-family="Arial">1</text>
  <text x="84" y="91" font-size="10" fill="#555" font-family="Arial">2</text>
  <text x="84" y="31" font-size="10" fill="#555" font-family="Arial">4</text>
</svg>
