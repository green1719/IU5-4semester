<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f8f6f0"/>
  <!-- Fibonacci rectangles -->
  <!-- Base squares scaled: 1unit=18px, arranged around center ~(150,105) -->
  <!-- 1,1,2,3,5,8 -->
  <rect x="132" y="87" width="18" height="18" fill="none" stroke="#7D32FF" stroke-width="1.2"/>
  <rect x="150" y="87" width="18" height="18" fill="none" stroke="#7D32FF" stroke-width="1.2"/>
  <rect x="132" y="69" width="36" height="18" fill="none" stroke="#7D32FF" stroke-width="1.2"/>
  <rect x="96"  y="69" width="36" height="36" fill="none" stroke="#7D32FF" stroke-width="1.2"/>
  <rect x="96"  y="105" width="54" height="54" fill="none" stroke="#7D32FF" stroke-width="1.2"/>
  <rect x="150" y="69"  width="96" height="90" fill="none" stroke="#7D32FF" stroke-width="1.2"/>
  <!-- Golden spiral arcs -->
  <path d="M 132 105 A 18 18 0 0 1 150 87" fill="none" stroke="#3187FF" stroke-width="2.2"/>
  <path d="M 150 105 A 18 18 0 0 1 168 87" fill="none" stroke="#3187FF" stroke-width="2.2"/>
  <path d="M 168 87  A 36 36 0 0 1 132 69" fill="none" stroke="#3187FF" stroke-width="2.2"/>
  <path d="M 132 69  A 36 36 0 0 1 96 105" fill="none" stroke="#3187FF" stroke-width="2.2"/>
  <path d="M 96 105  A 54 54 0 0 1 150 159" fill="none" stroke="#3187FF" stroke-width="2.2"/>
  <path d="M 150 159 A 90 90 0 0 1 246 69"  fill="none" stroke="#3187FF" stroke-width="2.2"/>
  <!-- Labels -->
  <text x="134" y="100" font-size="9"  fill="#555" font-family="Arial">1</text>
  <text x="152" y="100" font-size="9"  fill="#555" font-family="Arial">1</text>
  <text x="143" y="80"  font-size="9"  fill="#555" font-family="Arial">2</text>
  <text x="109" y="90"  font-size="9"  fill="#555" font-family="Arial">3</text>
  <text x="110" y="136" font-size="9"  fill="#555" font-family="Arial">5</text>
  <text x="188" y="117" font-size="9"  fill="#555" font-family="Arial">8</text>
  <!-- Title -->
  <text x="10" y="185" font-size="12" fill="#7D32FF" font-family="Arial" font-weight="bold">Спираль Фибоначчи</text>
</svg>
